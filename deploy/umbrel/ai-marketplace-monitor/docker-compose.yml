version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ai-marketplace-monitor_web_1
      APP_PORT: 8467
      # Umbrel's login protects the app; aimm then asks for no password of its own

  web:
    image: ghcr.io/bopeng/ai-marketplace-monitor:0.10.10@sha256:c548982467637979517e2359a8434c10c90f6dc3a2b68566e76420854a0c5ed1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: "1000"
      PGID: "1000"
      # Umbrel's app_proxy signs users in and has no settings form for the Facebook
      # credentials, so aimm skips its own sign-in; enter them in the config editor
      AIMM_WEBUI_AUTH: proxy
    volumes:
      - ${APP_DATA_DIR}/data:/data
