#
# AI
#
[ai.openai]
api_key = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
model = "gpt-4o"

# [ai.anthropic]
# api_key = 'sk-ant-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
# model = "claude-sonnet-5-5"

#
# Marketplace
#
[marketplace.facebook]
search_city = 'city'
# username and password are required (aimm searches only while logged in);
# they can also be provided via FACEBOOK_USERNAME and FACEBOOK_PASSWORD
# environment variables.
username = 'username'
password = 'password'
search_interval = '30m'
max_search_interval = '1h'
seller_locations = ['city', 'surrounding city']
notify = 'user1'
exclude_sellers = []

#
# Users and Notifications
#
[user.user1]
email = 'myself@gmail.com'
notify_with = ['email.gmail', 'notification.pushover', 'notification.pushbullet']

[user.user2]
email = 'user2@gmail.com'
notify_with = 'email.gmail'

# full email with photos, from a Gmail account (server and port are preset)
[email.gmail]
smtp_username = 'myself@gmail.com'
smtp_password = '${GMAIL_SMTP_PASSWORD}'
# a daily digest of searches, matches and rejected listings (local time)
digest_at = '08:00'

[notification.pushover]
pushover_user_key = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
pushover_api_token = 'someone@gmail.com'

[notification.pushbullet]
pushbullet_token = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'

#
# Items to search
#
[item.name1]
search_phrases = 'search word one'
search_region = 'usa'
search_interval = '1d'
delivery_method = 'shipping'
seller_locations = []

[item.name2]
search_phrases = ['search word one', 'search word two']
description = "it should be from manufacture, the seller should not offer shipping."
keywords = ['search word']
antikeywords = ['exclude word one', 'exclude word two']
notify = 'user2'
search_city = 'anothercity'
seller_locations = ['another city', 'surrounding city']
exclude_sellers = []
