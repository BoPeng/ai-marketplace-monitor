name: docker

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Only pin the app-store templates to this released version (e.g. 0.10.11), without building"
        required: false
        default: ""

jobs:
  build-and-push:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirror to Docker Hub, where Synology and QNAP container managers search, once the
      # repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN are set
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ai-marketplace-monitor
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/ai-marketplace-monitor,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image of a release tag is pushed, pin the app-store templates in deploy/ to it
  # (version and index digest) in a pull request; see CLAUDE.md. DEPLOY_PR_TOKEN
  # lets the pull request trigger the required checks before it is merged.
  bump-deploy:
    needs: build-and-push
    if: >-
      !failure() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0 # the release tags decide which version the templates must pin

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Pin the templates to the release
        id: bump
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          DEPLOY_PR_TOKEN: ${{ secrets.DEPLOY_PR_TOKEN }}
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not a release version; the templates stay as they are"
            exit 0
          fi
          if [[ -z "$DEPLOY_PR_TOKEN" ]]; then
            echo "::error::Set the DEPLOY_PR_TOKEN repository secret to a token with Contents and Pull requests read/write permissions; it is needed to create a PR that triggers CI."
            exit 1
          fi
          digest=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_deploy_versions import registry_digest; print(registry_digest(sys.argv[1]))" "$version")
          python scripts/bump_deploy_versions.py "$version" "$digest"
          python scripts/check_deploy_versions.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create template-update pull request
        if: steps.bump.outputs.version != ''
        id: pull-request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.DEPLOY_PR_TOKEN }}
          base: main
          branch: codex/bump-deploy-${{ steps.bump.outputs.version }}
          add-paths: deploy/
          delete-branch: true
          commit-message: "Pin the app-store templates to ${{ steps.bump.outputs.version }}"
          title: "Pin the app-store templates to ${{ steps.bump.outputs.version }}"
          body: |
            Update the CasaOS, Runtipi, Umbrel and TrueNAS templates for [v${{ steps.bump.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.bump.outputs.version }}).

            Umbrel and TrueNAS pin the published image index digest `${{ steps.bump.outputs.digest }}`. The bump also updates the store metadata and app revision counters.

            Validation: `python scripts/check_deploy_versions.py` passed against the registry. Merge after the required PR checks pass.

      - name: Report template-update pull request
        if: steps.pull-request.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: echo "Template-update PR — $PR_URL" >> "$GITHUB_STEP_SUMMARY"
