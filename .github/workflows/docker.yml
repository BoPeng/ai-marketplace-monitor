name: docker

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Only pin the app-store templates to this released version (e.g. 0.10.11), without building"
        required: false
        default: ""

jobs:
  build-and-push:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirror to Docker Hub, where Synology and QNAP container managers search, once the
      # repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN are set
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ai-marketplace-monitor
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/ai-marketplace-monitor,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image of a release tag is pushed, pin the app-store templates in deploy/ to it
  # (version and index digest) and commit them to main; see CLAUDE.md. Commits pushed with
  # GITHUB_TOKEN start no workflows, so this does not run itself again.
  bump-deploy:
    needs: build-and-push
    if: >-
      !failure() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # the release tags decide which version the templates must pin

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Pin the templates to the release
        id: bump
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not a release version; the templates stay as they are"
            exit 0
          fi
          digest=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_deploy_versions import registry_digest; print(registry_digest(sys.argv[1]))" "$version")
          python scripts/bump_deploy_versions.py "$version" "$digest"
          python scripts/check_deploy_versions.py
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit to main
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if git diff --quiet -- deploy; then
            echo "The templates already pin $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy
          git commit -m "Pin the app-store templates to $VERSION"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
