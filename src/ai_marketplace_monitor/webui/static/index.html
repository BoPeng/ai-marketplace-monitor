<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Marketplace Monitor</title>
  <link rel="stylesheet" href="/static/vendor/codemirror.css" />
  <link rel="stylesheet" href="/static/vendor/dialog.css" />
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-form">
      <h1 id="login-title">AI Marketplace Monitor</h1>
      <p id="login-subtitle" class="subtitle" hidden></p>
      <label>Username
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required autofocus />
      </label>
      <button type="submit" id="login-submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-left">
        <span class="brand">AI Marketplace Monitor</span>
        <span id="aimm-version" class="config-name" title="aimm version"></span>
        <button id="update-btn" class="status-chip status-update" hidden></button>
        <span id="config-name" class="config-name">—</span>
      </div>
      <div class="header-right">
        <a id="update-badge" class="status-chip status-update" target="_blank" rel="noopener" hidden></a>
        <span id="monitor-status" class="status-chip status-warn" title="Last activity from the monitor">● monitor: idle</span>
        <button id="run-btn" class="ghost small" title="Pause searches after the current listing" aria-label="Pause searches">⏸</button>
        <a id="browser-btn" class="ghost" href="/vnc/vnc.html?path=ws/vnc&autoconnect=1&resize=scale" target="_blank" rel="noopener" title="Open the live Chromium view (CAPTCHA / login)" hidden>Browser</a>
        <button id="export-csv-btn" class="ghost small" title="Download all found items as CSV" aria-label="Download all found items as CSV">⬇ Export CSV</button>
        <button id="logout-btn" class="ghost">Logout</button>
      </div>
    </header>
    <div id="login-banner" class="login-banner" role="status" hidden>
      <span id="login-banner-text"></span>
      <a id="login-banner-open" class="login-banner-open" target="_blank" rel="noopener" hidden>Open browser</a>
    </div>

    <main class="main">
      <section class="editor-pane">
        <div class="editor-toolbar">
          <div class="add-dropdown" id="add-dropdown">
            <button id="add-btn" class="toolbar-btn">+ Add section ▾</button>
            <div id="add-menu" class="add-menu hidden">
              <button data-prefix="item">Item to watch</button>
              <button data-prefix="user">User / notification</button>
              <button data-prefix="ai">AI backend</button>
              <button data-prefix="marketplace">Marketplace</button>
            </div>
          </div>
          <div class="toolbar-spacer"></div>
          <button id="save-btn" class="toolbar-btn save-btn" disabled>Save</button>
        </div>
        <div class="editor-with-gutter">
          <div id="gutter" class="gutter"><div id="gutter-inner" class="gutter-inner"></div></div>
          <div id="editor-host"></div>
        </div>
        <div id="editor-status" class="editor-status"></div>
      </section>

      <section class="chat-pane">
        <div class="chat-toolbar">
          <span class="pane-title">Configure</span>
          <input id="chat-section" list="chat-section-options" type="text" placeholder="section" autocomplete="off" />
          <datalist id="chat-section-options">
            <option value="ai"></option>
            <option value="marketplace"></option>
            <option value="item"></option>
            <option value="notification"></option>
            <option value="user"></option>
            <option value="region"></option>
            <option value="translation"></option>
            <option value="monitor"></option>
          </datalist>
          <button id="chat-start" class="toolbar-btn">Start</button>
          <button id="chat-cancel" class="toolbar-btn" disabled>Cancel</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div id="chat-options" class="chat-options"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" placeholder="Reply…" autocomplete="off" disabled />
          <button id="chat-send" class="toolbar-btn" disabled>Send</button>
        </form>
      </section>

      <section class="logs-pane">
        <div class="logs-toolbar">
          <div class="view-switch" role="tablist" aria-label="Show">
            <button data-view="logs" class="chip active" role="tab" aria-selected="true">Logs</button>
            <button data-view="listings" class="chip" role="tab" aria-selected="false" title="Every listing aimm evaluated, and what it decided">Listings</button>
          </div>
          <div id="logs-controls" class="toolbar-group">
            <div class="level-chips">
              <button data-level="ALL" class="chip active">All</button>
              <button data-level="WARNING" class="chip" title="Warnings and errors">Problems</button>
              <button data-level="ERROR" class="chip">Errors</button>
            </div>
            <input id="log-filter" class="text-filter" type="search" placeholder="Text filter…" />
            <label class="autoscroll">
              <input id="autoscroll" type="checkbox" checked /> auto-scroll
            </label>
          </div>
          <div id="listings-controls" class="toolbar-group" hidden>
            <select id="eval-item" title="Filter by item"><option value="">Any item</option></select>
            <select id="eval-stage" title="Filter by decision">
              <option value="">Any decision</option>
              <option value="notified">Notified</option>
              <option value="rejected">Rejected by AI</option>
              <option value="excluded">Excluded</option>
            </select>
            <select id="eval-rating" title="Minimum AI rating">
              <option value="">Any rating</option>
              <option value="3">≥ 3</option>
              <option value="4">≥ 4</option>
              <option value="5">= 5</option>
            </select>
            <input id="eval-filter" class="text-filter" type="search" placeholder="Text filter…" />
            <button id="eval-export" class="chip" title="Download the listings shown as CSV">⬇ CSV</button>
          </div>
        </div>
        <div id="logs" class="logs"></div>
        <div id="listings" class="listings" hidden></div>
      </section>
    </main>

    <footer class="footer">
      <span id="ws-status">● connecting…</span>
      <span id="mtime"></span>
    </footer>
  </div>

  <!-- Section form modal -->
  <div id="form-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card form-modal-card">
      <div class="modal-header">
        <h2 id="form-modal-title">Edit section</h2>
        <button class="modal-close" id="form-modal-close">×</button>
      </div>
      <div class="modal-body">
        <p id="form-modal-hint" class="modal-hint" hidden></p>
        <form id="section-form" class="section-form" autocomplete="off"></form>
        <div id="form-error" class="error" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="form-cancel" class="ghost">Cancel</button>
        <button type="button" id="form-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!--
    Load the vendored toml-edit-js (Rust→WASM port of toml_edit).
    Initializes once and exposes parse/edit/stringify on window.tomlEdit
    so the classic app.js script can call it after init resolves.
  -->
  <script type="module">
    import init, { parse, edit, stringify } from "/static/vendor/toml-edit-js/shims.js";
    window.tomlEditReady = (async () => {
      try {
        await init();
        window.tomlEdit = { parse, edit, stringify };
        document.dispatchEvent(new Event("tomlEditReady"));
      } catch (err) {
        console.error("toml-edit-js failed to initialize:", err);
        window.tomlEdit = null;
        document.dispatchEvent(new Event("tomlEditReady"));
      }
    })();
  </script>
  <script src="/static/vendor/codemirror.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
